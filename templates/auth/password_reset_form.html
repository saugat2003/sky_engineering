<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: { extend: { colors: { primary: "#6467f2" } } }
      };
    </script>
    <title>Reset Password | Broadcast Engineering Team Registry</title>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 font-sans antialiased">
    <div class="min-h-screen flex items-center justify-center p-6">
      <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl shadow-lg border border-slate-200 dark:border-slate-800 p-8 space-y-6">
        <div class="flex items-center gap-3 mb-2">
          <div class="size-10 rounded-xl bg-primary flex items-center justify-center text-white">
            <span class="material-symbols-outlined">lock_reset</span>
          </div>
          <div>
            <h1 class="text-xl font-bold text-slate-900 dark:text-white">Reset your password</h1>
            <p class="text-xs text-slate-500">Broadcast Engineering Registry</p>
          </div>
        </div>
        <p class="text-sm text-slate-600 dark:text-slate-400">
          Enter your email address and we'll send you a link to reset your password.
        </p>
        <form method="post" class="space-y-5">
          {% csrf_token %}
          <div class="flex flex-col gap-2">
            <label class="text-sm font-semibold text-slate-700 dark:text-slate-300" for="id_email">Email address</label>
            <div class="relative">
              <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">mail</span>
              <input
                class="w-full pl-10 pr-4 py-3 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none text-slate-900 dark:text-slate-100 text-sm"
                id="id_email" name="email" type="email" placeholder="engineer@broadcast.co" required
              />
            </div>
          </div>
          <button
            type="submit"
            class="w-full flex justify-center items-center gap-2 py-3 px-4 bg-primary hover:bg-primary/90 text-white font-bold rounded-lg transition-colors"
          >
            <span class="material-symbols-outlined text-lg">send</span>
            Send reset link
          </button>
        </form>
        <div class="text-center pt-2">
          <a href="{% url 'login' %}" class="text-sm text-primary font-semibold hover:underline">← Back to Login</a>
        </div>
      </div>
    </div>
  </body>
</html>
