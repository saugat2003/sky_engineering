<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap" />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: { extend: { colors: { primary: "#6467f2" } } }
      };
    </script>
    <title>Password Reset Complete | Broadcast Engineering Team Registry</title>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 font-sans antialiased">
    <div class="min-h-screen flex items-center justify-center p-6">
      <div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl shadow-lg border border-slate-200 dark:border-slate-800 p-8 space-y-6 text-center">
        <div class="size-16 rounded-full bg-primary/10 text-primary flex items-center justify-center mx-auto">
          <span class="material-symbols-outlined text-3xl">verified</span>
        </div>
        <div>
          <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Password updated!</h1>
          <p class="text-sm text-slate-500 mt-2">
            Your password has been set successfully. You can now log in with your new password.
          </p>
        </div>
        <a
          href="{% url 'login' %}"
          class="inline-flex items-center justify-center gap-2 w-full py-3 px-4 bg-primary hover:bg-primary/90 text-white font-bold rounded-lg transition-colors"
        >
          <span class="material-symbols-outlined text-lg">login</span>
          Go to Login
        </a>
      </div>
    </div>
  </body>
</html>
